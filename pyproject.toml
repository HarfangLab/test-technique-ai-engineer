[project]
name = "test-technique-ai-engineer"
version = "0.1.0"
description = "LLM-powered assistant for answering questions about cybersecurity documents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mistralai>=2.9.1",
    "python-dotenv>=1.2.2",
    "click>=8.1.0",
    "tenacity>=8.2.0",
    "rich>=15.0.0",
]

[project.scripts]
test-technique-ai-engineer = "test_technique_ai_engineer:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
